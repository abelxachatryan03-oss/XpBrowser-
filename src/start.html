<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>XpBrowser — Начало</title>
<style>
    html, body {
        margin: 0; padding: 0; height: 100%;
        font-family: Tahoma, sans-serif;
        background: linear-gradient(180deg, #3F8CF3 0%, #0058EE 40%, #003CAA 100%);
        color: #fff;
        user-select: none;
    }
    .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .logo {
        font-size: 64px;
        font-weight: bold;
        text-shadow: 2px 2px 0 #003C74, -1px -1px 0 rgba(255,255,255,0.4);
        letter-spacing: -2px;
    }
    .tagline {
        margin-top: 10px;
        font-size: 16px;
        opacity: 0.9;
        text-shadow: 1px 1px 0 #003C74;
    }
    .search {
        margin-top: 40px;
        display: flex;
        background: #fff;
        border: 2px solid #003C74;
        border-radius: 3px;
    }
    .search input {
        border: none;
        outline: none;
        padding: 10px 14px;
        width: 420px;
        font-size: 15px;
        font-family: Tahoma, sans-serif;
    }
    .search button {
        border: none;
        background: linear-gradient(180deg, #F8FCFF 0%, #BAD2F1 100%);
        border-left: 1px solid #7F9DB9;
        padding: 0 18px;
        font-family: Tahoma, sans-serif;
        font-size: 14px;
        cursor: pointer;
    }
    .footer {
        position: absolute;
        bottom: 20px;
        font-size: 12px;
        opacity: 0.7;
    }
</style>
</head>
<body>
    <div class="wrap">
        <div class="logo">XpBrowser</div>
        <div class="tagline">Windows XP в твоём браузере</div>
        <form class="search" onsubmit="event.preventDefault(); var q=this.q.value.trim(); if(q){ location.href='https://www.google.com/search?q='+encodeURIComponent(q); }">
            <input name="q" placeholder="Введите запрос и нажмите Enter..." autofocus>
            <button type="submit">Найти</button>
        </form>
    </div>
    <div class="footer">XpBrowser v0.1 — Luna Blue Edition</div>
</body>
</html>
